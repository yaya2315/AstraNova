<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8cc" />
      <stop offset="55%" stop-color="#ffb020" />
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Orbit rings -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00F0FF" stroke-opacity="0.4" stroke-width="1.4" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#7B61FF" stroke-opacity="0.32" stroke-width="1.4" />

  <!-- Sun glow -->
  <circle cx="32" cy="32" r="13" fill="#ffb020" fill-opacity="0.18" />
  <circle cx="32" cy="32" r="9" fill="url(#sunCore)" />

  <!-- Planets, mid-orbit like a freeze-frame of the animated logo -->
