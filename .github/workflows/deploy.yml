name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular base path
        id: basepath
        run: |
          # Un repo "usuario.github.io" se publica en la raíz del dominio.
          # Cualquier otro repo se publica en una subcarpeta con su propio
          # nombre: usuario.github.io/nombre-repo/ — Next.js necesita saber
          # ese prefijo para que las texturas, scripts y chunks resuelvan bien.
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (next build → out/)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.value }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Sin esto, si el repo nunca tuvo Pages habilitado desde la API
          # (aunque en Settings → Pages ya diga "GitHub Actions"), este paso
          # tira "Get Pages site failed... Not Found". Con enablement:true
          # la propia action lo habilita sola en vez de fallar.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
